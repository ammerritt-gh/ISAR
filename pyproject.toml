[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "isar"
version = "0.1.0"
description = "ISAR — automated inelastic-scattering data reduction, review, and triage-fitting pipeline"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "iminuit>=2.25",
    "dynesty>=3,<4",  # rwalk draws are seeded-deterministic per major version only; validated on 3.0.0
]

[project.optional-dependencies]
test = ["pytest>=7.4", "pytest-xdist>=3.5", "pytest-timeout>=2.3", "lmfit>=1.2"]  # lmfit: comparison backend only
test-gui = ["pytest-qt"]
gui = ["PySide6", "pyqtgraph>=0.13,<0.15", "watchdog"]
calibration = ["ultranest>=4.6,<5"]  # deep-pass calibration cross-check only (tools/calibrate_deep_pass.py); never in the default install

[project.scripts]
isar = "isar.cli.main:main"

[tool.setuptools]
packages = ["isar", "isar.synth", "isar.synth.stat2b", "isar.schema", "isar.parsers", "isar.synth_format", "isar.reduce", "isar.report", "isar.analyze", "isar.analyze.errors", "isar.calibrate", "isar.session", "isar.cli", "isar.drive", "isar.drive.supervisor", "isar.drive.acquisition", "isar.drive.instrument", "isar.drive.isar_io", "isar.geometry", "isar.scene", "isar.workspace_api", "isar.plotspec", "isar.plotspec.backends", "isar_gui", "isar_gui.viewmodels", "isar_gui.views"]

[tool.setuptools.package-data]
# Ship the human-authored card policy templates (D8) inside the wheel.
"isar.parsers" = ["cards/*.toml"]
# Overlay files for the O41 example workspace (Help ▸ Create O41 Example). The seed campaign
# artifacts they overlay live under docs/campaigns/ and are NOT packaged, so the menu item still
# needs a source checkout; without this entry it would fail even from one.
"isar_gui" = ["resources/eig4-o41-authoritative/*", "resources/*.html"]   # the Help quick guide is read at runtime

[tool.pytest.ini_options]
# Phase 1 lives under isar/synth/tests; Phase 2 (schema, parsers, synth_format) under tests/.
testpaths = ["isar/synth/tests", "tests"]
# Session safety (owner ruling 2026-08-08): no single test may wedge a run — a hang or a
# pathological escalation chain becomes a named failure instead of a silent hour.
# Statistical coverage/bias campaigns require --run-statistical; integration tests remain
# in the full lane. Suite wrappers must also impose an overall wall-clock timeout.
timeout = 900
markers = [
    "statistical: repeated-fit calibration/bias campaigns; require --run-statistical",
    "slow: marks tests that run many fits (deselect with '-m \"not slow\"')",
    "live: marks tests that require a running TAVI at 127.0.0.1:8642 (set ISAR_LIVE_TAVI to enable)",
    "golden: sealed held-out real-data gates (S12) — run only when the owner names it (set ISAR_GOLDEN=1, or run-isar-proofs.bat golden; needs local real_data/golden/; proofs/, not tests)",
]
