[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "isar-synth"
version = "0.1.0"
description = "ISAR Phase 1 — synthetic-core validation harness for DHO spectrum fitting"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "iminuit>=2.25",
    "lmfit>=1.2",
    "dynesty>=2.1",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools]
# Fitting_Functions.py is a top-level module at the repo root, imported unchanged.
py-modules = ["Fitting_Functions"]
packages = ["isar", "isar.synth", "isar.schema", "isar.parsers", "isar.synth_format", "isar.reduce", "isar.report", "isar.analyze", "isar.analyze.errors", "isar.calibrate"]

[tool.setuptools.package-data]
# Ship the human-authored card policy templates (D8) inside the wheel.
"isar.parsers" = ["cards/*.toml"]

[tool.pytest.ini_options]
# Phase 1 lives under isar/synth/tests; Phase 2 (schema, parsers, synth_format) under tests/.
testpaths = ["isar/synth/tests", "tests"]
markers = [
    "slow: marks tests that run many fits (deselect with '-m \"not slow\"')",
]
