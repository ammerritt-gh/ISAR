[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "isar"
version = "0.1.0"
description = "ISAR — automated inelastic-scattering data reduction, review, and triage-fitting pipeline"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "iminuit>=2.25",
    "dynesty>=3,<4",  # rwalk draws are seeded-deterministic per major version only; validated on 3.0.0
]

[project.optional-dependencies]
test = ["pytest>=7.4", "pytest-xdist>=3.5", "pytest-timeout>=2.3", "lmfit>=1.2"]  # lmfit: comparison backend only
test-gui = ["pytest-qt"]
gui = ["PySide6", "pyqtgraph>=0.13,<0.15", "watchdog"]

[project.scripts]
isar = "isar.cli.main:main"

[tool.setuptools]
packages = ["isar", "isar.synth", "isar.synth.stat2b", "isar.schema", "isar.parsers", "isar.synth_format", "isar.reduce", "isar.report", "isar.analyze", "isar.analyze.errors", "isar.calibrate", "isar.session", "isar.cli", "isar.drive", "isar.drive.supervisor", "isar.drive.acquisition", "isar.drive.instrument", "isar.drive.isar_io", "isar.geometry", "isar.scene", "isar.workspace_api", "isar.plotspec", "isar.plotspec.backends", "isar.eig", "isar_gui", "isar_gui.viewmodels", "isar_gui.views"]

[tool.setuptools.package-data]
# Ship the human-authored card policy templates (D8) inside the wheel.
"isar.parsers" = ["cards/*.toml"]
# Overlay files for the O41 example workspace (Help ▸ Create O41 Example). The seed campaign
# artifacts they overlay live under docs/campaigns/ and are NOT packaged, so the menu item still
# needs a source checkout; without this entry it would fail even from one.
"isar_gui" = ["resources/eig4-o41-authoritative/*"]

[tool.pytest.ini_options]
# Phase 1 lives under isar/synth/tests; Phase 2 (schema, parsers, synth_format) under tests/.
testpaths = ["isar/synth/tests", "tests"]
# Session safety (owner ruling 2026-08-08): no single test may wedge a run — a hang or a
# pathological escalation chain becomes ONE named failure instead of a silent hour. The three
# heaviest campaign tests carry explicit @pytest.mark.timeout budgets; everything else fits
# far inside 900 s. Raising this global to accommodate a new test is a smell, not a fix.
# The escalation sampler that made those three expensive is capped for the suite by the
# repo-root conftest (ISAR_ESCALATION_N_LIVE); see its docstring for why that does not weaken
# what the tests assert. Measured 2026-08-09: full parallel lane 11:25, heaviest test 614 s.
timeout = 900
markers = [
    "slow: marks tests that run many fits (deselect with '-m \"not slow\"')",
    "live: marks tests that require a running TAVI at 127.0.0.1:8642 (set ISAR_LIVE_TAVI to enable)",
    "golden: sealed held-out real-data gates (S12) — run only when the owner names it (set ISAR_GOLDEN=1; needs local test_data/golden/)",
]
