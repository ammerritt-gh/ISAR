[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "isar"
version = "0.1.0"
description = "ISAR — automated inelastic-scattering data reduction, review, and triage-fitting pipeline"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "iminuit>=2.25",
    "lmfit>=1.2",
    "dynesty>=3,<4",  # rwalk draws are seeded-deterministic per major version only; validated on 3.0.0
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
isar = "isar.cli.main:main"

[tool.setuptools]
# Fitting_Functions.py is a top-level module at the repo root, imported unchanged.
py-modules = ["Fitting_Functions"]
packages = ["isar", "isar.synth", "isar.schema", "isar.parsers", "isar.synth_format", "isar.reduce", "isar.report", "isar.analyze", "isar.analyze.errors", "isar.calibrate", "isar.session", "isar.cli", "isar.drive", "isar.drive.supervisor", "isar.drive.acquisition", "isar.drive.instrument", "isar.drive.isar_io", "isar.geometry", "isar.workspace_api"]

[tool.setuptools.package-data]
# Ship the human-authored card policy templates (D8) inside the wheel.
"isar.parsers" = ["cards/*.toml"]

[tool.pytest.ini_options]
# Phase 1 lives under isar/synth/tests; Phase 2 (schema, parsers, synth_format) under tests/.
testpaths = ["isar/synth/tests", "tests"]
markers = [
    "slow: marks tests that run many fits (deselect with '-m \"not slow\"')",
    "live: marks tests that require a running TAVI at 127.0.0.1:8642 (set ISAR_LIVE_TAVI to enable)",
]
