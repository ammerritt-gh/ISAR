# S30 HERIX (APS) — RAW .spec ingestion (individual miniscans), 2025 beamtime.
# Human-authored policy half of the experiment card (D8): the machine READS this, never writes it.
#
# Unlike the supplementary card (s30.policy.toml), this reads the RAW file: each fscan energy point
# is a group of `miniscans_per_point` consecutive repeated-energy acquisition passes, and ISAR does
# the cosmic-ray rejection itself — controlled, tracked, reversible (§0.4) — instead of inheriting
# the beamline's irreversible deletion. The signal columns are the bare `AnaN` per-pass counts.

facility = "APS"
instrument = "S30"
format_version = "2025-raw"
plugin = "spec_s30_raw"

energy_column = "HerixE"        # the fscan abscissa (already-converted energy), data column 0
monitor_column = "ICO-C"        # the incident-flux ion-chamber monitor (per pass)
time_column = "Seconds"         # per-pass counting time (first of the duplicated Seconds columns)
counting_mode = "time"          # fscan counts to time; the monitor is the recorded flux
normalize_by = "monitor"        # ICO-C is the flux monitor: stored + gates validity (==0 -> masked).
                                # The stored signal is RAW COUNTS (combine kept passes; divide
                                # downstream only if you choose — raw counts show √N errors plainly)
raw_abscissa_kind = "energy"    # HerixE is already energy...
energy_status = "needs_zero"    # ...but the elastic zero is uncalibrated (the zero-fit is Phase 3)
variance_convention = "none"    # D3: store variance honestly, NO zero-count floor
min_points = 5
hkl_round_step = 0.05
measurement_pattern = "fscan"   # an fscan is a measurement
alignment_pattern = "ascan"     # an ascan (motor scan) is an alignment, refined by motor below
exclusions_seed = []

# Raw #L carries space-containing column names; collapse them so columns resolve by name.
multiword_columns = ["Heat Stage T1", "Heat Stage T2", "Heat Stage T3"]
# Nominal passes per point. The parser groups by *runs of equal energy* (the real pass count varies
# per point, 2..45 observed), so this is only a hint for the synthetic emitter, not the grouping.
miniscans_per_point = 15

[temperature_rule]
setpoint_field = "T_Control"    # named in the global #H2 group; value read from this scan's #V2
sensor_fields = ["T_Sample"]
divergence_tol = 5.0

[collation]
key = ["sample", "q", "T"]
merge = "separate"

[qc]                            # deterministic QC thresholds (§7.1-7.2) — all have code defaults
empty_k = 5.0                   # a peak excursion must beat empty_k*sqrt(median) or the spectrum is flat
stale_min_run = 3               # a leading near-equal, high, low-scatter run this long is stale_head
stale_equal_tol = 0.02          # "near-equal" = within 2% of the first point's value
stale_high_frac = 0.5           # ...and "high" = at least 50% of the spectrum max (background fails this)

# Cosmic-ray rejection policy (§7.3). `poisson` is ISAR's default: it refuses to reject sub-level
# fluctuations the beamline's blind 3-sigma clip nukes (e.g. a single legitimate count at an
# otherwise-empty point). `sigma_clip` reproduces the beamline mean±Nσ clip (used to validate
# against the supplementary in Gate C).
[reduction]
rule = "poisson"                # "poisson" | "sigma_clip"
sigma_n = 3.0                   # for sigma_clip: reject passes beyond mean ± sigma_n·std
poisson_k = 5.0                 # for poisson: reject pass only if it exceeds others by k·sqrt(level)
poisson_min_level = 10.0        # ...and only when the kept-others level is at least this many counts

# ascan classification by scanned motor (the command's first motor token). Unlisted motors default
# to "alignment". An ascan over herixE is an elastic-line energy calibration.
[ascan_classification]
herixE = "calibration"

# The nine analyzers. value_index is the #V line carrying this analyzer's H/K/L; signal_column is
# the bare per-pass AnaN counts column resolved by name from #L. Per-analyzer Q is read from the
# file (D2). `enabled` marks which analyzers carry signal THIS experiment (§0.3).
[[detectors]]
detector_id = "ana1"
value_index = 4
signal_column = "Ana1"
enabled = true

[[detectors]]
detector_id = "ana2"
value_index = 5
signal_column = "Ana2"
enabled = true

[[detectors]]
detector_id = "ana3"
value_index = 6
signal_column = "Ana3"
enabled = true

[[detectors]]
detector_id = "ana4"
value_index = 7
signal_column = "Ana4"
enabled = true

[[detectors]]
detector_id = "ana5"
value_index = 8
signal_column = "Ana5"
enabled = true

[[detectors]]
detector_id = "ana6"
value_index = 9
signal_column = "Ana6"
enabled = true

[[detectors]]
detector_id = "ana7"
value_index = 10
signal_column = "Ana7"
enabled = true

[[detectors]]
detector_id = "ana8"
value_index = 11
signal_column = "Ana8"
enabled = true

[[detectors]]
detector_id = "ana9"
value_index = 12
signal_column = "Ana9"
enabled = true
