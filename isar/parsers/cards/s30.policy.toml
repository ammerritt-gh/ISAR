# S30 HERIX (APS) — IXS, SPEC supplementary format, 2025 beamtime.
# Human-authored policy half of the experiment card (D8): the machine READS this, never writes it.
# Copy this template per beamtime, edit the detector enables and exclusions, and run reduction.

facility = "APS"
instrument = "S30"
format_version = "2025"
plugin = "spec_s30"

energy_column = "HerixE"        # the abscissa column (already-converted energy)
monitor_column = "ICO-C"        # the incident-flux ion-chamber monitor
time_column = "Seconds"         # per-point counting time
counting_mode = "time"          # fscan counts to time; the monitor is the flux normalizer
normalize_by = "monitor"        # ICO-C is the flux monitor: stored + gates validity (==0 -> masked).
                                # The stored signal is RAW COUNTS; we do NOT divide by it (normalize
                                # downstream if you wish — raw counts state the Poisson error plainly)
raw_abscissa_kind = "energy"    # HerixE is already energy...
energy_status = "needs_zero"    # ...but the elastic zero is uncalibrated (the zero-fit is Phase 3)
variance_convention = "none"    # D3: store variance honestly, NO zero-count floor
min_points = 5
hkl_round_step = 0.05
measurement_pattern = "fscan"   # an fscan is a measurement
alignment_pattern = "ascan"     # an ascan (motor scan) is an alignment
exclusions_seed = []            # durable bad-scan numbers go here, e.g. [55217]  # bad mono feedback

[temperature_rule]
setpoint_field = "T_Control"
sensor_fields = ["T_Sample"]
divergence_tol = 5.0            # |sensor - setpoint| beyond this flags sensor_divergence (QC, later)

[collation]
key = ["sample", "q", "T"]
merge = "separate"             # S30 keeps duplicate measurements as separate points

[calibration]                 # how the energy zero + resolution are established (UNIFICATION_DESIGN §3)
method = "bragg_companion"    # the K≈0 elastics live in the companion raw .spec (not this .dat)
companion_glob = "*.spec"     # raw SPEC files in the data dir are the elastic source (never parsed
                              # as measurements — see the R2 guard). Narrow this (e.g. the exact
                              # "<experiment>.spec") when a directory holds more than one experiment.
analyzer_column = "Ana7"      # elastic counts column for the zero + per-slit resolution fits
k_max = 0.05                  # a herixE block is a zone-centre elastic only if |K| <= this
slit_p_group = 17             # per-scan slit for MEASUREMENTS: raw .spec #P<group>[index]...
slit_p_index = 4              # ...index 4 of #P17 is the Ana7 slit (matches calibrate.bragg)

[fitting]                     # user fitting guidelines (UNIFICATION_DESIGN §6) — all optional
# detectors = ["ana7"]        # which spectra to fit (default: all enabled detectors)
# omega_window = [1.0, 20.0]  # a resolved fit with omega0 outside this window is demoted to flagged
monitor_frac = 0.9            # mask a point whose monitor counted short of this fraction of preset
min_fit_points = 6            # fewer usable points than this -> non-result (undersampled)

[qc]                          # deterministic QC thresholds (§7.1-7.2) — all have code defaults
empty_k = 5.0                 # a peak excursion must beat empty_k*sqrt(median) or the spectrum is flat
stale_min_run = 3             # a leading near-equal, high, low-scatter run this long is stale_head
stale_equal_tol = 0.02        # "near-equal" = within 2% of the first point's value
stale_high_frac = 0.5         # ...and "high" = at least 50% of the spectrum max (background fails this)

# The nine analyzers. value_index is the #V line carrying this analyzer's H/K/L (named by the
# parallel #H line); signal_column is the AnaN_*std column resolved by name from #L. Per-analyzer Q
# is read from the file (D2), so q_offset is unused here. `enabled` marks which analyzers carry
# signal THIS experiment (§0.3) — flip to false for a known-dead analyzer.
[[detectors]]
detector_id = "ana1"
value_index = 4
signal_column = "Ana1_3std"
enabled = true

[[detectors]]
detector_id = "ana2"
value_index = 5
signal_column = "Ana2_3std"
enabled = true

[[detectors]]
detector_id = "ana3"
value_index = 6
signal_column = "Ana3_3std"
enabled = true

[[detectors]]
detector_id = "ana4"
value_index = 7
signal_column = "Ana4_3std"
enabled = true

[[detectors]]
detector_id = "ana5"
value_index = 8
signal_column = "Ana5_3std"
enabled = true

[[detectors]]
detector_id = "ana6"
value_index = 9
signal_column = "Ana6_3std"
enabled = true

[[detectors]]
detector_id = "ana7"
value_index = 10
signal_column = "Ana7_3std"
enabled = true

[[detectors]]
detector_id = "ana8"
value_index = 11
signal_column = "Ana8_3std"
enabled = true

[[detectors]]
detector_id = "ana9"
value_index = 12
signal_column = "Ana9_3std"
enabled = true
