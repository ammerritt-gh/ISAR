# BL43LXU (SPring-8) - meV-resolution IXS, processed per-analyzer files.
#
# This file is read by EVERY BL43 workspace (isar.schema.card: `plugin = "sp8_bl43"` names it). It holds the
# format knowledge - how the files are named, grouped and decoded, what the axis and the counts mean, the
# analyzer list and how BL43 is calibrated - and the agent edits it only when the beamline's output format
# changes: the fix then reaches every workspace at once. The workspace's own `card.policy.toml` is a copy of
# the marked region below and holds analysis settings only; a format key written there is ignored with a
# warning. Temperature, slit, dead analyzers, excluded scans and the resolution folder are never card edits:
# they are entered in the ISAR GUI.
#
# One scan is a SET of files, one per analyzer (28 analyzers: a03-a09, a14-a20, a25-a31, a35-a41).
# ISAR turns each set into one scan with one spectrum per analyzer. Two layouts are read:
#   * CsV3Sb5 layout: <stem>_aNN beside <stem>.var (the beamline's processed output). The file name
#     carries the sample, the temperature and the NOMINAL arm-centre HKL of the scan; no analyzer's
#     own HKL, no scan number.
#   * Ba122 layout: spec1_T<T>K__scan_<n>_A<a>_Q_<h>_<k>_<l>_inel.dat (the group's export macro):
#     three columns, no monitor, and the scan, temperature, analyzer and that analyzer's HKL in the name.
# A header written at the top of an analyzer file (`# hkl 0.5 0.5 3`, `# T_K 302`, `# agaph_mm 60`,
# `# agapv_mm 60`, `# scan 12`, ...) overrides the same fact from the file name; a value entered in the GUI
# overrides both.
#
# Counts are RAW: N = (intensity / error)^2, recovered from the printed numbers. The monitor and the
# counting time of each analyzer are stored beside its counts, never divided in.

facility = "SP8"
instrument = "BL43LXU"
format_version = "processed"

energy_column = "meV"           # the bin centre, energy transfer in meV on the beamline's own axis
monitor_column = "norm_i"       # the monitor of the chosen column family (norm_lr for _lr)
time_column = "secs"            # counting time per bin (lrn x 0.25 s for _lr)
counting_mode = "monitor"
normalize_by = "monitor"        # a bin whose monitor is 0 is masked and flagged; the counts stay raw
raw_abscissa_kind = "energy"    # the axis is already in meV...
energy_status = "needs_zero"    # ...but its zero is not trusted: scans are HELD until a zero exists
variance_convention = "none"    # D3: variance = counts, NO zero-count floor
measurement_pattern = "processed"   # unused: processed files carry no scan command
alignment_pattern = "none"          # unused: every scan in these files is a measurement

# --- isar init copies the analysis settings from here ---
# Analysis settings of this experiment, read from this file in the workspace (card.policy.toml). The file
# format is read from the BL43 file shipped with ISAR, not from here; temperature, slit, dead analyzers,
# excluded scans and the resolution folder are entered in the ISAR GUI.
plugin = "sp8_bl43"
min_points = 5
hkl_round_step = 0.05
exclusions_seed = []

[temperature_rule]              # no sensor in the files; the setpoint is the file's T_K or the temperature entered in the GUI

[collation]
key = ["sample", "q", "T"]
merge = "separate"              # no pooling of repeat scans until per-analyzer exposure is pooled safely

[fitting]
min_fit_points = 6              # fewer usable points than this -> non-result (undersampled)
# detectors = ["a06"]           # which analyzers to fit (default: all 28)

# The fast pass's thresholds. The values shown are the installed defaults (PROVISIONAL, calibrated on
# generated spectra 2026-10-26: your call). Uncomment a line to change it; a change refits the
# affected scans on the next run.
# [fitting.fast_pass]
# seed_stop_gain = 6.0                                 # 2*dlnL a seed peak must add (not calibrated)
# confident_anchor = [[0.0, 50.0]]                      # [spectrum max count, counts a peak's removal must change]
# flag_residual_threshold = 10.05                      # residual-scan statistic at or above which "possible hidden component" is flagged (0 = off)
# overdamped_correlation = 0.8                         # |corr(omega0, Gamma)| above which a peak is warned overdamped

# The prior (a data-derived empirical-Bayes starting point; the defaults are the 2026-10-25 recipe).
# [fitting.prior]
# amplitude_margin = 1.2     # peak and elastic heights flat on [0, margin x the highest count]
# width_kind = "softlog"     # width density 1/(Gamma + width_knee); "flat" = uniform
# width_knee = 0.12          # meV
# width_cap = 20.0           # meV, largest Gamma
# energy_cap = 20.0          # meV, largest omega0

# [sample]
# name = "CsV3Sb5"              # names the experiment in the ledger (default: the SPEC file name, else the file stem)
# --- to here ---

[files]
# Each measurement pattern is matched against the whole file name and must name `set` (the scan's
# key, shared by every analyzer file of the scan) and `analyzer`. `sample`, `T_K`, `hkl_nominal`,
# `hkl`, `specfile` and `scan_numbers` groups become facts (a number is written `0p5` for 0.5 and `m0p5`
# for -0.5). `specfile` (the SPEC file name, e.g. spec1) names the experiment a scan came from, and
# `scan_numbers` lists the scans a file holds: one number is a single scan, several a file the
# beamline already summed (passed over when its individual scans are in the same folder).
measurement = [
    '(?P<set>(?P<sample>.+?)_(?P<T_K>\d+(?:p\d+)?)K_(?P<hkl_nominal>m?\d+(?:p\d+)?_m?\d+(?:p\d+)?_m?\d+(?:p\d+)?)(?:_[A-Za-z0-9]+)*)_a(?P<analyzer>\d{2})',
    '(?P<set>(?P<specfile>spec\d+)_T(?P<T_K>\d+(?:p\d+)?)K__scan_(?P<scan_numbers>\d+(?:_\d+)*))_A(?P<analyzer>\d{1,2})_Q_(?P<hkl>m?\d+(?:p\d+)?_m?\d+(?:p\d+)?_m?\d+(?:p\d+)?)_inel\.dat',
]
sidecar = ["{set}.var"]         # beside the analyzer files: bin size, silicon order, per-analyzer efficiency
# Never measurements: peak-position lists, the summed file (the bare stem) and the resolution curves
# (`sarf_*`, in rf/, which discovery finds inside the imported folder). `*_sum` assumes that
# stem ends in `_sum`; for another name, add its file name here, e.g. "Smp_tot".
ignore = ["*.pkpos", "*_sum", "sarf_*"]

[reader]
# The column family the counts are read from. "_i" gives integer counts: raw, and the right choice.
# "_lr" splits some counts between neighbouring bins, so its counts are NOT raw: they are kept unrounded
# and every _lr spectrum carries a counts_not_integer warning, whatever its bins recover to.
intensity_family = "_i"

[calibration]
# Each analyzer is fitted with the beamline's own measured resolution curve (SARF) for the scan's slit, and
# its energy zero is the fitted elastic line. Without a curve (no folder, or none for that analyzer at that
# slit) the analyzer is parsed and shown but held, with a missing_resolution flag naming it. The folder is
# the experiment's setting, not a card key: ISAR finds `rf/` inside the imported folder, or the GUI locates
# it. The slit is the `slit` fact (header, file name or the GUI); with none given, ISAR infers it from the
# elastic lines and says so (slit_inferred); a given slit is never overridden (slit_mismatch only warns).
method = "tabulated_elastic"            # zero + curve from the beamline's SARF files
# A regular expression matching a whole file name; (?P<analyzer>) and (?P<setting>) pick the analyzer
# and the slit (height_width in mm) out of it. The .gpi files beside the curves are not matched.
resolution_pattern = 'sarf_.+_s\d+_(?P<setting>\d+_\d+)_(?P<analyzer>a\d{2})'
zero_fallback = "file_axis"             # no significant elastic line: use the file's own axis, labelled pipeline_zero

# The analyzers. `value_index` and `signal_column` are unused for this instrument (the reader finds its
# columns by name, from [reader]). An analyzer a scan did not measure is a dead analyzer, declared in the
# GUI; it is still read and shown.
[[detectors]]
detector_id = "a03"
value_index = 0
signal_column = "y_i"

[[detectors]]
detector_id = "a04"
value_index = 1
signal_column = "y_i"

