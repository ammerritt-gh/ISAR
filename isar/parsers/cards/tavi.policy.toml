# TAVI — McStas triple-axis SIMULATOR (virtual PUMA), HTTP-API scan JSON. Human-authored policy
# half of the experiment card (D8): the machine READS this, never writes it.
#
# TAVI is NOT a real instrument. Each input file is the JSON body of a `GET /scan/{id}/data` response
# (one completed scan per file): a frozen `launch.parameters` set + a `result` block with the scanned
# variable and per-point RAW COUNTS. The stored signal is RAW COUNTS; the "monitor" is the simulated
# source budget `number_neutrons` per point (constant) — stored, not divided in.
#
# Because TAVI is a simulator with fixed ki/kf geometry, the meV energy axis is ABSOLUTE (exact) — no
# elastic-zero fit. Cooper-Nathans resolution is analytical per scan. Several CN inputs are NOT in
# TAVI's payload (sample temperature, mono/ana/sample mosaics, scattering senses, vertical
# collimations); the [calibration] constants below supply them. Each is a candidate for a TAVI-side
# API follow-up so per-scan truth can replace these constants.

facility = "TAVI"              # dedicated simulator catalogue — never collides with real-instrument
instrument = "PUMA"            # parsers (ill_in8, spec_s30). Registry tuple (facility, instrument, fmt).
format_version = "v1"
plugin = "tavi"

# TAVI JSON has no column table; these name the logical channels the parser reads from the payload.
energy_column = "deltaE"       # result.scan_values_1 when result.variable_1 == "deltaE"
monitor_column = "number_neutrons"   # the simulated source budget per point (constant)
counting_mode = "monitor"      # counts to a fixed neutron budget per point (monitor-like)
normalize_by = "monitor"       # number_neutrons gates the normalizer; signal stays RAW COUNTS
raw_abscissa_kind = "energy"   # deltaE scans are energy transfer (meV)...
energy_status = "absolute"     # ...and fixed ki/kf simulator geometry makes the axis exact
variance_convention = "none"   # D3: variance = counts, NO zero-count floor
min_points = 5
hkl_round_step = 0.05
measurement_pattern = "deltaE" # a deltaE scan is a measurement
alignment_pattern = "omega"    # a motor/angle scan is an alignment
exclusions_seed = []

[temperature_rule]
# TAVI's API does not expose sample temperature. This card setpoint stands in (source: setpoint).
# TODO(TAVI): expose a per-scan sample temperature so this constant can be replaced by truth.
setpoint = 300.0

[collation]
key = ["sample", "q", "T"]
merge = "merge"                # combine repeat simulated scans at the same (Q, T)
t_round = 5.0

[calibration]                  # UNIFICATION_DESIGN §3
method = "cooper_nathans"      # analytical per-scan energy resolution (isar.calibrate.tas)
# d-spacings (Angstrom): override the crystal-id → d map baked into the parser. Uncomment to pin.
# dm = 3.355                   # monochromator (PG002)
# da = 3.355                   # analyzer (PG002)
# Mosaics + senses TAVI does NOT expose — documented defaults (arcmin; senses = SM, SS, SA):
etam = 30.0                    # monochromator mosaic
etaa = 30.0                    # analyzer mosaic
etas = 0.0                     # sample mosaic; 0 = omit (Cooper-Nathans then reuses etam)
senses = [1, -1, 1]            # SM, SS, SA (mono +1, sample -1, analyzer +1)
# Vertical collimations BET1..4 (arcmin) — not in the payload; horizontal ALF1..4 come from the
# scan's `collimation.alpha_*`. Also the ALF fallback if a scan's collimation slot is unparseable.
bet = [30.0, 30.0, 30.0, 30.0]
collimations = [30.0, 30.0, 30.0, 30.0]

[sample]
name = "tavi"                  # experiment_id fallback (TAVI JSONs carry no EXPNO)
# experiment_id = "SIM-001"    # optional explicit experiment id (wins over name)

# The single McStas detector. value_index is unused (no #V lines); signal_column names the payload's
# per-point counts. Per-scan Q comes from launch.parameters H/K/L, not an offset.
[[detectors]]
detector_id = "det"
value_index = 0
signal_column = "counts"
enabled = true
